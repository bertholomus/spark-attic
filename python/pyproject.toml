# spark-attic's Python client and its vLLM / SGLang hooks.
# No build step is needed: put this folder on PYTHONPATH (the static spark_attic-0.1.0.dist-info beside the package
# registers the entry points), or `pip install --no-deps ./python`.
[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-attic"
version = "0.1.0"
description = "Borrow a GB10's display carveout from atticd as CUDA device memory"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
dependencies = []

[project.entry-points."vllm.general_plugins"]
spark_attic = "spark_attic.vllm_plugin:register"

[project.entry-points."sglang.srt.plugins"]
spark_attic = "spark_attic.sglang_plugin:register"

[tool.setuptools]
packages = ["spark_attic"]
