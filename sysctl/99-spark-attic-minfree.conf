# spark-attic, optional (INSTALL.md section 3). For DGX OS on a GB10 with the 64 KiB-page kernel (uname -r ends
# in -64k): the kernel's own vm.min_free_kbytes from boot. There, transparent huge pages raise it to 5% of memory
# (6,466,368 kB on a GB10), which keeps about 9.7 GiB out of MemAvailable. 45560 is the kernel's own default for a
# GB10's memory. Measured on the 64 KiB-page
# kernel 7.0.0-1024-nvidia-64k: idle MemAvailable 121,147 MiB with this file from boot (DGX OS 7.6.0), 108,209 MiB
# without it (DGX OS 7.5.0). It takes effect at the next boot. To undo: remove this file and reboot.
vm.min_free_kbytes = 45560
